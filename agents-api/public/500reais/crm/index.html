<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CRM Pedidos R$500 | SuaLuma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08060f;--bg2:#0e0b18;--bg3:#131020;--bg4:#19152c;--bg5:#1e1934;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --gold:#c9a84c;--gold2:#e8c97a;--gold-dim:rgba(201,168,76,0.14);
  --text:#f0ecfa;--text2:#a098bc;--text3:#6b6080;
  --green:#34d399;--red:#ef4444;--orange:#f97316;--blue:#60a5fa;
  --purple-glow:rgba(120,60,220,0.2);
  --radius:10px;--radius-lg:16px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--bg5)}

/* ── HEADER ── */
.crm-header{padding:16px 28px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.crm-header-left{display:flex;align-items:center;gap:20px}
.crm-logo{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;color:var(--text)}
.crm-logo span{color:var(--gold)}
.crm-logo small{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.1em;display:block;margin-top:-2px}

.crm-search{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;width:200px;transition:border-color .2s}
.crm-search::placeholder{color:var(--text3)}
.crm-search:focus{border-color:var(--gold)}

.crm-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crm-summary{display:flex;gap:12px;flex-wrap:wrap}
.crm-summary-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 14px;text-align:center;min-width:64px}
.crm-summary-item .num{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;color:var(--text);line-height:1}
.crm-summary-item .lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

.btn-primary{background:var(--gold);color:#1a0e00;border:none;border-radius:8px;padding:10px 20px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .2s,transform .15s;white-space:nowrap}
.btn-primary:hover{background:#b8922e;transform:translateY(-1px)}
.btn-sm{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.btn-sm:hover{background:var(--bg4);border-color:rgba(201,168,76,.3);color:var(--text)}
.btn-sm.danger{color:var(--red);border-color:rgba(239,68,68,.2)}
.btn-sm.danger:hover{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}
.btn-sm.gold{color:var(--gold);border-color:rgba(201,168,76,.25)}
.btn-sm.gold:hover{background:var(--gold-dim)}

/* ── KANBAN ── */
.kanban-wrap{height:calc(100vh - 90px);overflow-x:auto;overflow-y:hidden;padding:20px 24px}
.kanban-board{display:flex;gap:16px;height:100%;min-width:max-content;padding-bottom:10px}
.kanban-col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);min-width:300px;width:300px;display:flex;flex-direction:column;max-height:100%}
.kanban-col-header{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.kanban-col-header .col-info{display:flex;align-items:center;gap:10px}
.kanban-col-header .col-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
.kanban-col-header .col-count{background:var(--bg3);border:1px solid var(--border2);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:600;color:var(--text3);min-width:22px;text-align:center}
.kanban-col-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:100px}
.kanban-col-body.drag-over{background:rgba(201,168,76,.05);border-radius:8px}

/* ── CARD ── */
.kanban-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:grab;transition:border-color .2s,background .2s,transform .15s,box-shadow .2s;position:relative}
.kanban-card:hover{border-color:rgba(201,168,76,.3);background:var(--bg4);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.kanban-card.dragging{opacity:.5;transform:rotate(2deg)}
.kanban-card .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.kanban-card .card-name{font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:var(--text);line-height:1.3;word-break:break-word}
.kanban-card .card-project{font-size:11px;color:var(--text2);margin-bottom:8px;word-break:break-word}
.kanban-card .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.kanban-card .card-prazo{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:4px}
.kanban-card .card-prazo.atrasado{color:var(--red)}
.card-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge-urgente{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.badge-alta{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.25)}
.badge-media{background:rgba(96,165,250,.15);color:var(--blue);border:1px solid rgba(96,165,250,.25)}
.badge-baixa{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.2)}

.progress-mini{height:3px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.progress-mini-fill{height:100%;border-radius:99px;transition:width .5s ease;background:linear-gradient(to right,var(--gold),var(--gold2))}
.progress-mini-fill.done{background:var(--green)}
.progress-mini-fill.warn{background:var(--orange)}

.card-actions{position:absolute;top:10px;right:10px;display:none;gap:4px}
.kanban-card:hover .card-actions{display:flex}
.card-actions button{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:10px;cursor:pointer;color:var(--text3);transition:all .2s;line-height:1}
.card-actions button:hover{background:var(--bg4);color:var(--text)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:90vh;overflow-y:auto;padding:0;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-header h2{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;color:var(--text)}
.modal-close{background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;padding:4px;line-height:1;transition:color .2s}
.modal-close:hover{color:var(--text)}
.modal-body{padding:24px;display:flex;flex-direction:column;gap:16px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--bg2)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.form-group input,.form-group select,.form-group textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold)}
.form-group textarea{resize:vertical;min-height:60px}
.form-group select{appearance:none;cursor:pointer}
.form-group input[type=range]{border:none;background:none;padding:4px 0;accent-color:var(--gold)}

/* ── CHECKLIST ── */
.checklist-item{display:flex;align-items:center;gap:10px;padding:6px 0}
.checklist-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;flex-shrink:0}
.checklist-item span{font-size:13px;color:var(--text2);flex:1}
.checklist-item.done span{text-decoration:line-through;color:var(--text3)}
.checklist-item .remove-check{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px}
.checklist-item .remove-check:hover{color:var(--red)}
.add-check-btn{background:none;border:1px dashed var(--border2);border-radius:6px;padding:8px;color:var(--text3);font-size:12px;cursor:pointer;transition:all .2s;margin-top:4px}
.add-check-btn:hover{border-color:rgba(201,168,76,.3);color:var(--gold)}

/* ── UPLOAD ── */
.upload-area{background:var(--bg3);border:2px dashed var(--border2);border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:rgba(201,168,76,.3);background:var(--bg4)}
.upload-area.dragover{border-color:var(--gold);background:rgba(201,168,76,.08)}
.upload-area p{font-size:12px;color:var(--text3);margin-top:6px}
.upload-area .icon{font-size:28px}
.upload-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.upload-item{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);max-width:100%}
.upload-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.upload-item .remove-up{border:none;background:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0;line-height:1;flex-shrink:0}
.upload-item .remove-up:hover{color:var(--red)}
.upload-item img{width:32px;height:32px;object-fit:cover;border-radius:4px;flex-shrink:0}

/* ── CONFIRM ── */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-overlay.open{display:flex}
.confirm-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:32px 28px;max-width:380px;text-align:center;animation:modalIn .2s ease}
.confirm-box h3{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;margin-bottom:8px}
.confirm-box p{color:var(--text2);font-size:13px;margin-bottom:20px;line-height:1.5}
.confirm-actions{display:flex;gap:10px;justify-content:center}

/* ── BOTÃO VOLTAR ── */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text3);text-decoration:none;font-size:13px;transition:color .2s;margin-right:8px}
.back-link:hover{color:var(--gold)}

/* ── EMPTY STATE ── */
.empty-col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;text-align:center;color:var(--text3);font-size:12px;gap:8px;flex:1}
.empty-col .icon{font-size:32px;opacity:.4}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .crm-header{padding:12px 16px;flex-direction:column;align-items:stretch;gap:12px}
  .crm-header-left{flex-wrap:wrap}
  .crm-search{width:100%}
  .crm-actions{flex-direction:column;align-items:stretch}
  .crm-summary{justify-content:center}
  .kanban-wrap{padding:12px 12px}
  .kanban-col{min-width:260px;width:260px}
  .form-grid{grid-template-columns:1fr}
  .modal{padding:0;border-radius:var(--radius)}
  .modal-header{padding:16px 18px}
  .modal-body{padding:18px}
  .modal-footer{padding:14px 18px;flex-direction:column}
  .modal-footer .btn-primary{width:100%}
  .upload-list{flex-direction:column}
  .card-actions{display:flex;position:static;margin-top:8px}
}

@media(max-width:480px){
  .kanban-col{min-width:220px;width:220px}
  .kanban-card{padding:12px}
  .crm-summary-item{padding:4px 10px;min-width:50px}
  .crm-summary-item .num{font-size:14px}
}
</style>
</head>
<body>

<div class="crm-header">
  <div class="crm-header-left">
    <a href="/500reais/" class="back-link">← Voltar</a>
    <div class="crm-logo">
      Sua<span>Luma</span>
      <small>CRM Pedidos R$500</small>
    </div>
    <input type="text" class="crm-search" id="searchInput" placeholder="Buscar cliente ou projeto..." oninput="renderBoard()">
  </div>
  <div class="crm-actions">
    <div class="crm-summary" id="summary">
      <div class="crm-summary-item"><div class="num" id="tot-pedidos">0</div><div class="lbl">Total</div></div>
      <div class="crm-summary-item"><div class="num" id="tot-andamento">0</div><div class="lbl">Andamento</div></div>
      <div class="crm-summary-item"><div class="num" id="tot-entregues">0</div><div class="lbl">Entregues</div></div>
      <div class="crm-summary-item"><div class="num" id="tot-atrasados">0</div><div class="lbl">Atrasados</div></div>
    </div>
    <button class="btn-primary" onclick="openNewOrder()">+ Novo Pedido</button>
  </div>
</div>

<div class="kanban-wrap">
  <div class="kanban-board" id="kanbanBoard"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Novo Pedido</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveOrder()">Salvar Pedido</button>
    </div>
  </div>
</div>

<!-- CONFIRM -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3 id="confirmTitle">Tem certeza?</h3>
    <p id="confirmText">Esta ação não pode ser desfeita.</p>
    <div class="confirm-actions">
      <button class="btn-sm" onclick="closeConfirm()">Cancelar</button>
      <button class="btn-sm danger" id="confirmBtn" onclick="">Confirmar</button>
    </div>
  </div>
</div>

<script>
const COLUMNS = [
  { id:'novo',        label:'Novos Pedidos',      color:'#60a5fa' },
  { id:'andamento',   label:'Em Andamento',       color:'#f97316' },
  { id:'aguardando',  label:'Aguardando Cliente',  color:'#c9a84c' },
  { id:'revisao',     label:'Em Revisão',          color:'#a78bfa' },
  { id:'entregue',    label:'Entregues',           color:'#34d399' },
];

const STORAGE_KEY = 'sualuma_crm_pedidos';
let orders = [];
let editingId = null;
let confirmCallback = null;

function loadOrders(){
  try{
    var d=localStorage.getItem(STORAGE_KEY);
    orders=d?JSON.parse(d):[];
  }catch(e){orders=[]}
  if(!orders.length){
    orders=getSeedOrders();
    saveOrders();
  }
}

function getSeedOrders(){
  return [
    {id:'s1',nome:'Ana Beatriz',whatsapp:'11999999999',email:'ana@email.com',projeto:'Salão Beleza Studio',status:'novo',prazo:'2026-06-10',observacoes:'Cliente quer site com galeria de fotos',links:'',dominio:'',login:'',senha:'',prioridade:'alta',progresso:0,checklist:[{text:'Reunir referências',done:false},{text:'Criar protótipo',done:false}],anexos:[],imagens:[],criadoEm:new Date().toISOString()},
    {id:'s2',nome:'Carlos Eduardo',whatsapp:'11988888888',email:'carlos@email.com',projeto:'Restaurante Sabor Caseiro',status:'andamento',prazo:'2026-06-05',observacoes:'Cardápio digital + delivery',links:'',dominio:'',login:'',senha:'',prioridade:'urgente',progresso:35,checklist:[{text:'Estrutura de páginas',done:true},{text:'Design responsivo',done:false},{text:'Integrar WhatsApp',done:false}],anexos:[],imagens:[],criadoEm:new Date().toISOString()},
    {id:'s3',nome:'Marina Silveira',whatsapp:'11977777777',email:'marina@email.com',projeto:'Clínica Bem-Estar',status:'aguardando',prazo:'2026-06-15',observacoes:'Aguardando fotos da clínica',links:'',dominio:'',login:'',senha:'',prioridade:'media',progresso:20,checklist:[{text:'Página inicial',done:true},{text:'Área de serviços',done:false},{text:'Blog',done:false}],anexos:[],imagens:[],criadoEm:new Date().toISOString()},
    {id:'s4',nome:'Rafael Oliveira',whatsapp:'11966666666',email:'rafael@email.com',projeto:'Loja Artesanato',status:'revisao',prazo:'2026-06-02',observacoes:'Revisar cores da marca',links:'',dominio:'',login:'',senha:'',prioridade:'alta',progresso:85,checklist:[{text:'Home page',done:true},{text:'Catálogo',done:true},{text:'Carrinho',done:true},{text:'Testes finais',done:false}],anexos:[],imagens:[],criadoEm:new Date().toISOString()},
    {id:'s5',nome:'Juliana Costa',whatsapp:'11955555555',email:'juliana@email.com',projeto:'Personal Trainer',status:'entregue',prazo:'2026-05-28',observacoes:'Site entregue e publicado',links:'https://julianatrainer.com',dominio:'julianatrainer.com',login:'juliana',senha:'****',prioridade:'baixa',progresso:100,checklist:[{text:'Design',done:true},{text:'Desenvolvimento',done:true},{text:'Publicação',done:true}],anexos:[],imagens:[],criadoEm:new Date().toISOString()},
  ];
}

function saveOrders(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(orders));
}

function generateId(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,6);
}

function colIndex(id){
  return COLUMNS.findIndex(c=>c.id===id);
}

/* ── RENDER ── */
function renderBoard(){
  var board=document.getElementById('kanbanBoard');
  var search=document.getElementById('searchInput').value.toLowerCase().trim();

  var filtered=orders;
  if(search){
    filtered=orders.filter(function(o){
      return o.nome.toLowerCase().includes(search)||o.projeto.toLowerCase().includes(search)||o.email.toLowerCase().includes(search);
    });
  }

  var html='';
  COLUMNS.forEach(function(col){
    var items=filtered.filter(function(o){return o.status===col.id});
    var colHtml='';
    items.forEach(function(card){
      colHtml+=renderCard(card);
    });
    if(!items.length){
      colHtml+='<div class="empty-col"><div class="icon">📋</div><span>'+(search?'Nenhum resultado':'Nenhum pedido')+'</span></div>';
    }
    html+='<div class="kanban-col" data-col="'+col.id+'" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">'+
      '<div class="kanban-col-header"><div class="col-info"><span class="col-title" style="color:'+col.color+'">'+col.label+'</span><span class="col-count">'+items.length+'</span></div></div>'+
      '<div class="kanban-col-body" id="col-body-'+col.id+'">'+colHtml+'</div></div>';
  });
  board.innerHTML=html;
  updateSummary();
}

function renderCard(o){
  var diasRestantes=Math.ceil((new Date(o.prazo)-new Date())/86400000);
  var prazoClass=diasRestantes<0?'atrasado':'';
  var prazoText=diasRestantes<0?Math.abs(diasRestantes)+' dias atrasado':(diasRestantes===0?'Hoje':diasRestantes+' dias');
  var badgeClass='badge-'+o.prioridade;
  var progClass=o.progresso>=100?'done':(o.progresso>50?'warn':'');

  return '<div class="kanban-card" draggable="true" ondragstart="onDragStart(event,\''+o.id+'\')" ondragend="onDragEnd(event)" onclick="openEditOrder(\''+o.id+'\')">'+
    '<div class="card-actions"><button onclick="event.stopPropagation();openEditOrder(\''+o.id+'\')" title="Editar">✏️</button><button onclick="event.stopPropagation();confirmDelete(\''+o.id+'\')" title="Excluir">🗑️</button></div>'+
    '<div class="card-head"><div class="card-name">'+esc(o.nome)+'</div><span class="card-badge '+badgeClass+'">'+o.prioridade+'</span></div>'+
    '<div class="card-project">'+esc(o.projeto)+'</div>'+
    '<div class="card-meta"><span class="card-prazo '+prazoClass+'">📅 '+prazoText+'</span></div>'+
    '<div class="progress-mini"><div class="progress-mini-fill '+progClass+'" style="width:'+o.progresso+'%"></div></div>'+
  '</div>';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function updateSummary(){
  var total=orders.length;
  var andamento=orders.filter(function(o){return o.status==='andamento'||o.status==='novo'||o.status==='aguardando'||o.status==='revisao'}).length;
  var entregues=orders.filter(function(o){return o.status==='entregue'}).length;
  var atrasados=orders.filter(function(o){return o.prazo&&new Date(o.prazo)<new Date()&&o.status!=='entregue'}).length;
  document.getElementById('tot-pedidos').textContent=total;
  document.getElementById('tot-andamento').textContent=andamento;
  document.getElementById('tot-entregues').textContent=entregues;
  document.getElementById('tot-atrasados').textContent=atrasados;
}

/* ── DRAG & DROP ── */
var dragId=null;

function onDragStart(e,id){
  dragId=id;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',id);
}

function onDragEnd(e){
  e.target.classList.remove('dragging');
  dragId=null;
  document.querySelectorAll('.kanban-col-body').forEach(function(el){el.classList.remove('drag-over')});
}

function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  var colBody=e.target.closest('.kanban-col-body');
  if(colBody)colBody.classList.add('drag-over');
}

function onDragLeave(e){
  var colBody=e.target.closest('.kanban-col-body');
  if(colBody)colBody.classList.remove('drag-over');
}

function onDrop(e){
  e.preventDefault();
  document.querySelectorAll('.kanban-col-body').forEach(function(el){el.classList.remove('drag-over')});
  var col=e.target.closest('.kanban-col');
  if(!col||!dragId)return;
  var newStatus=col.dataset.col;
  var order=orders.find(function(o){return o.id===dragId});
  if(order&&order.status!==newStatus){
    order.status=newStatus;
    if(newStatus==='entregue')order.progresso=100;
    saveOrders();
    renderBoard();
  }
}

/* ── MODAL ── */
function openNewOrder(){
  editingId=null;
  document.getElementById('modalTitle').textContent='Novo Pedido';
  renderForm({id:'',nome:'',whatsapp:'',email:'',projeto:'',status:'novo',prazo:'',observacoes:'',links:'',dominio:'',login:'',senha:'',prioridade:'media',progresso:0,checklist:[{text:'',done:false}],anexos:[],imagens:[]});
  document.getElementById('modalOverlay').classList.add('open');
}

function openEditOrder(id){
  editingId=id;
  var o=orders.find(function(x){return x.id===id});
  if(!o)return;
  document.getElementById('modalTitle').textContent='Editar Pedido';
  renderForm(JSON.parse(JSON.stringify(o)));
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  editingId=null;
}

function renderForm(o){
  var checklistHtml='';
  o.checklist.forEach(function(item,i){
    checklistHtml+='<div class="checklist-item'+(item.done?' done':'')+'">'+
      '<input type="checkbox" '+(item.done?'checked':'')+' onchange="toggleCheck('+i+',this.checked)">'+
      '<input type="text" value="'+esc(item.text)+'" onchange="updateCheckText('+i+',this.value)" style="background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:4px 8px;font-size:13px;color:var(--text);flex:1;font-family:Inter,sans-serif;outline:none">'+
      '<button class="remove-check" onclick="removeCheck('+i+')">✕</button></div>';
  });

  var imagensHtml='';
  o.imagens.forEach(function(img,i){
    imagensHtml+='<div class="upload-item"><img src="'+img.url+'" alt=""><span class="name">'+esc(img.name)+'</span><button class="remove-up" onclick="removeImg('+i+')">✕</button></div>';
  });
  var anexosHtml='';
  o.anexos.forEach(function(a,i){
    var icon=a.type&&a.type.startsWith('image/')?'🖼️':'📎';
    anexosHtml+='<div class="upload-item"><span>'+icon+'</span><span class="name">'+esc(a.name)+'</span><button class="remove-up" onclick="removeAnexo('+i+')">✕</button></div>';
  });

  document.getElementById('modalBody').innerHTML=
    '<div class="form-grid">'+
      '<div class="form-group"><label>Nome do Cliente</label><input type="text" id="f-nome" value="'+esc(o.nome)+'" placeholder="Nome completo"></div>'+
      '<div class="form-group"><label>WhatsApp</label><input type="text" id="f-whatsapp" value="'+esc(o.whatsapp)+'" placeholder="(11) 99999-9999"></div>'+
      '<div class="form-group"><label>E-mail</label><input type="email" id="f-email" value="'+esc(o.email)+'" placeholder="email@exemplo.com"></div>'+
      '<div class="form-group"><label>Nome do Projeto</label><input type="text" id="f-projeto" value="'+esc(o.projeto)+'" placeholder="Ex: Salão Beleza"></div>'+
      '<div class="form-group"><label>Status</label><select id="f-status">'+
        COLUMNS.map(function(c){return '<option value="'+c.id+'"'+(o.status===c.id?' selected':'')+'>'+c.label+'</option>'}).join('')+
      '</select></div>'+
      '<div class="form-group"><label>Prioridade</label><select id="f-prioridade">'+
        ['baixa','media','alta','urgente'].map(function(p){return '<option value="'+p+'"'+(o.prioridade===p?' selected':'')+'>'+p.charAt(0).toUpperCase()+p.slice(1)+'</option>'}).join('')+
      '</select></div>'+
      '<div class="form-group"><label>Prazo</label><input type="date" id="f-prazo" value="'+o.prazo+'"></div>'+
      '<div class="form-group"><label>Progresso: <span id="progressVal">'+o.progresso+'</span>%</label><input type="range" min="0" max="100" value="'+o.progresso+'" id="f-progresso" oninput="document.getElementById(\'progressVal\').textContent=this.value"></div>'+
      '<div class="form-group full"><label>Observações</label><textarea id="f-observacoes" rows="3" placeholder="Anotações do pedido...">'+esc(o.observacoes)+'</textarea></div>'+
      '<div class="form-group full"><label>Links</label><input type="text" id="f-links" value="'+esc(o.links)+'" placeholder="URLs relevantes"></div>'+
      '<div class="form-group"><label>Domínio</label><input type="text" id="f-dominio" value="'+esc(o.dominio)+'" placeholder="meusite.com.br"></div>'+
      '<div class="form-group"><label>Login</label><input type="text" id="f-login" value="'+esc(o.login)+'" placeholder="Usuário"></div>'+
      '<div class="form-group"><label>Senha</label><input type="text" id="f-senha" value="'+esc(o.senha)+'" placeholder="******"></div>'+
    '</div>'+

    '<div class="form-group full"><label>Checklist</label><div id="checklistContainer">'+checklistHtml+'</div>'+
    '<button class="add-check-btn" onclick="addCheckItem()">+ Adicionar item</button></div>'+

    '<div class="form-group full"><label>Imagens</label>'+
    '<div class="upload-area" id="imgUploadArea" onclick="document.getElementById(\'imgInput\').click()" ondragover="event.preventDefault();this.classList.add(\'dragover\')" ondragleave="this.classList.remove(\'dragover\')" ondrop="handleImgDrop(event)">'+
    '<div class="icon">🖼️</div><p>Clique ou arraste imagens aqui</p></div>'+
    '<input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImgSelect(this)">'+
    '<div class="upload-list" id="imgList">'+imagensHtml+'</div></div>'+

    '<div class="form-group full"><label>Anexos</label>'+
    '<div class="upload-area" id="fileUploadArea" onclick="document.getElementById(\'fileInput\').click()" ondragover="event.preventDefault();this.classList.add(\'dragover\')" ondragleave="this.classList.remove(\'dragover\')" ondrop="handleFileDrop(event)">'+
    '<div class="icon">📎</div><p>Clique ou arraste arquivos aqui</p></div>'+
    '<input type="file" id="fileInput" multiple style="display:none" onchange="handleFileSelect(this)">'+
    '<div class="upload-list" id="fileList">'+anexosHtml+'</div></div>';

  // Store temp data for uploads
  window._formData=o;
}

function collectForm(){
  var o=window._formData||{checklist:[],anexos:[],imagens:[]};
  o.nome=document.getElementById('f-nome').value;
  o.whatsapp=document.getElementById('f-whatsapp').value;
  o.email=document.getElementById('f-email').value;
  o.projeto=document.getElementById('f-projeto').value;
  o.status=document.getElementById('f-status').value;
  o.prioridade=document.getElementById('f-prioridade').value;
  o.prazo=document.getElementById('f-prazo').value;
  o.progresso=parseInt(document.getElementById('f-progresso').value)||0;
  o.observacoes=document.getElementById('f-observacoes').value;
  o.links=document.getElementById('f-links').value;
  o.dominio=document.getElementById('f-dominio').value;
  o.login=document.getElementById('f-login').value;
  o.senha=document.getElementById('f-senha').value;
  return o;
}

function saveOrder(){
  var o=collectForm();
  if(!o.nome.trim()||!o.projeto.trim()){
    alert('Preencha nome do cliente e nome do projeto.');
    return;
  }
  if(editingId){
    var idx=orders.findIndex(function(x){return x.id===editingId});
    if(idx>=0){
      o.id=editingId;
      o.criadoEm=orders[idx].criadoEm;
      orders[idx]=o;
    }
  }else{
    o.id=generateId();
    o.criadoEm=new Date().toISOString();
    orders.push(o);
  }
  saveOrders();
  closeModal();
  renderBoard();
}

/* ── CHECKLIST ── */
function addCheckItem(){
  var o=window._formData;
  if(!o.checklist)o.checklist=[];
  o.checklist.push({text:'',done:false});
  renderForm(o);
}

function removeCheck(i){
  var o=window._formData;
  if(!o.checklist)return;
  o.checklist.splice(i,1);
  renderForm(o);
}

function toggleCheck(i,checked){
  var o=window._formData;
  if(!o.checklist||!o.checklist[i])return;
  o.checklist[i].done=checked;
  var container=document.getElementById('checklistContainer');
  if(container){
    var items=container.querySelectorAll('.checklist-item');
    if(items[i])items[i].classList.toggle('done',checked);
  }
}

function updateCheckText(i,val){
  var o=window._formData;
  if(!o.checklist||!o.checklist[i])return;
  o.checklist[i].text=val;
}

/* ── UPLOADS ── */
function readFileAsDataURL(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){cb({name:file.name,url:e.target.result,type:file.type})};
  reader.readAsDataURL(file);
}

function handleImgSelect(input){
  Array.from(input.files).forEach(function(file){
    readFileAsDataURL(file,function(data){
      var o=window._formData;
      if(!o.imagens)o.imagens=[];
      o.imagens.push(data);
      renderForm(o);
    });
  });
  input.value='';
}

function handleImgDrop(e){
  e.preventDefault();
  e.target.classList.remove('dragover');
  Array.from(e.dataTransfer.files).forEach(function(file){
    if(file.type.startsWith('image/')){
      readFileAsDataURL(file,function(data){
        var o=window._formData;
        if(!o.imagens)o.imagens=[];
        o.imagens.push(data);
        renderForm(o);
      });
    }
  });
}

function removeImg(i){
  var o=window._formData;
  if(!o.imagens)return;
  o.imagens.splice(i,1);
  renderForm(o);
}

function handleFileSelect(input){
  Array.from(input.files).forEach(function(file){
    readFileAsDataURL(file,function(data){
      var o=window._formData;
      if(!o.anexos)o.anexos=[];
      o.anexos.push(data);
      renderForm(o);
    });
  });
  input.value='';
}

function handleFileDrop(e){
  e.preventDefault();
  e.target.classList.remove('dragover');
  Array.from(e.dataTransfer.files).forEach(function(file){
    readFileAsDataURL(file,function(data){
      var o=window._formData;
      if(!o.anexos)o.anexos=[];
      o.anexos.push(data);
      renderForm(o);
    });
  });
}

function removeAnexo(i){
  var o=window._formData;
  if(!o.anexos)return;
  o.anexos.splice(i,1);
  renderForm(o);
}

/* ── CONFIRM ── */
function confirmDelete(id){
  document.getElementById('confirmTitle').textContent='Excluir Pedido';
  document.getElementById('confirmText').textContent='Tem certeza que deseja excluir este pedido? Esta ação não pode ser desfeita.';
  document.getElementById('confirmBtn').onclick=function(){
    orders=orders.filter(function(o){return o.id!==id});
    saveOrders();
    closeConfirm();
    renderBoard();
  };
  document.getElementById('confirmOverlay').classList.add('open');
}

function closeConfirm(){
  document.getElementById('confirmOverlay').classList.remove('open');
}

/* ── KEYBOARD ── */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(document.getElementById('confirmOverlay').classList.contains('open'))closeConfirm();
    else closeModal();
  }
});

/* ── INIT ── */
loadOrders();
renderBoard();
</script>
