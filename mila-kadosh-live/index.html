<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta

    <title>Mila Kadosh — Amor & Ódio</title>

<body>

<div class="experience">

    <!-- =====================================
         TÍTULO
    ====================================== -->

    <header class="brand">

        <h1 id="brandName">
            MILA KADOSH
        </h1>

        <p id="brandSubtitle">
            amor & ódio — capítulo Halloween
        </p>

    </header>


    <!-- =====================================
         CENÁRIO PRINCIPAL
    ====================================== -->

    <main class="hero">

        <!-- CAPAS -->

        <div class="covers">

            <article class="cover cover-1">
                <div class="cover-image"></div>
                <span>capa 01</span>
            </article>

            <article class="cover cover-2">
                <div class="cover-image"></div>
                <span>capa 02</span>
            </article>

            <article class="cover cover-3">
                <div class="cover-image"></div>
                <span>capa 03</span>
            </article>

            <article class="cover cover-4">
                <div class="cover-image"></div>
                <span>capa 04</span>
            </article>

            <article class="cover cover-5">
                <div class="cover-image"></div>
                <span>capa 05</span>
            </article>

            <article class="cover cover-6">
                <div class="cover-image"></div>
                <span>capa 06</span>
            </article>

            <article class="cover cover-7">
                <div class="cover-image"></div>
                <span>capa 07</span>
            </article>

            <article class="cover cover-8">
                <div class="cover-image"></div>
                <span>capa 08</span>
            </article>

            <article class="cover cover-9">
                <div class="cover-image"></div>
                <span>capa 09</span>
            </article>

        </div>


        <!-- =====================================
             ARTISTA
        ====================================== -->

        <div class="artist-stage">

            <div class="artist-placeholder" id="artistPlaceholder">

                <span>
                    FOTO DA ARTISTA
                </span>

            </div>

            <img
                id="artistPhoto"
                class="artist-photo"
                src=""
                alt="Mila Kadosh"
            >


            <!--
            IMPORTANTE:

            A máscara é uma imagem separada.

            Isso permitirá posteriormente:
            máscara cair
            máscara derreter
            máscara crescer
            máscara mudar para vermelho/preto
            -->

            <img
                id="maskImage"
                class="mask-image"
                src=""
                alt="Máscara"
            >

        </div>

    </main>


    <!-- =====================================
         CTA
    ====================================== -->

    

<!-- FALLING ALBUM MOCKUP -->
<div class="falling-album" id="fallingAlbum">

    <div class="falling-disc" aria-hidden="true">
        <div class="disc-hole"></div>
    </div>

    <div class="falling-sleeve">

        <img
            id="fallingAlbumCover"
            class="falling-album-cover"
            src=""
            alt="Amor & Ódio"
        >

        <div
            class="falling-album-placeholder"
            id="fallingAlbumPlaceholder"
        >
            <span>AMOR</span>
            <span>&</span>
            <span>ÓDIO</span>
        </div>

    </div>

</div>

<section class="interaction">

        <button
            id="dropMaskButton"
            class="main-button"
            type="button"
        >
            deixe a máscara cair
        </button>

        <p id="ctaSubtitle">
            Ao tocar, a máscara cai e revela a experiência.
        </p>

    </section>


    <!-- =====================================
         ORNAMENTO
    ====================================== -->

    <div class="ornament">

        <span></span>

        <div class="mini-mask">
            ◇
        </div>

        <span></span>

    </div>

        </p>

        <nav class="social">

            </a>

        </nav>

    </footer>
