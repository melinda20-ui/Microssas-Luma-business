<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta name="theme-color" content="#050505">

<title>Ajustar máscara — Mila Kadosh</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    min-height: 100%;

    background: #050505;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(40px, env(safe-area-inset-bottom));
}

.page {
    width: min(100%, 520px);
    margin: 0 auto;
}

.back {
    display: inline-block;

    margin-bottom: 18px;

    color: #999;

    text-decoration: none;

    font-size: 15px;
}

h1 {
    margin: 0;

    font-family:
        Georgia,
        serif;

    font-size: 38px;

    font-weight: 400;
}

.subtitle {
    margin:
        8px 0
        20px;

    color: #999;

    font-size: 15px;

    line-height: 1.55;
}


/* =========================================
   ÁREA DE AJUSTE
========================================= */

.preview-shell {

    width: 100%;

    overflow: hidden;

    border-radius: 24px;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        radial-gradient(
            circle at 50% 35%,
            #250000 0%,
            #0b0000 42%,
            #000 78%
        );

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.7);
}


.preview-stage {

    position: relative;

    width: 100%;

    /*
       Aproxima a proporção real
       da artista na home mobile.
    */
    aspect-ratio: 0.73 / 1;

    overflow: hidden;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;
}


#previewArtist {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    object-position:
        bottom center;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;
}


#previewMask {

    position: absolute;

    left: 50%;

    top: 15%;

    width: 33%;

    height: auto;

    transform:
        translate(-50%, -50%)
        rotate(0deg);

    transform-origin:
        center center;

    z-index: 10;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;

    filter:
        drop-shadow(
            0 5px 14px
            rgba(120,0,0,.65)
        );
}


.guide-x,
.guide-y {

    position: absolute;

    z-index: 5;

    pointer-events: none;

    opacity: .22;
}

.guide-x {

    left: 0;

    top: 50%;

    width: 100%;

    border-top:
        1px dashed #fff;
}

.guide-y {

    top: 0;

    left: 50%;

    height: 100%;

    border-left:
        1px dashed #fff;
}


.helper {

    position: absolute;

    z-index: 30;

    left: 50%;

    bottom: 12px;

    transform:
        translateX(-50%);

    padding:
        8px
        13px;

    border-radius:
        999px;

    background:
        rgba(0,0,0,.68);

    color:
        rgba(255,255,255,.82);

    font-size: 12px;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================
   CONTROLES
========================================= */

.panel {

    margin-top: 18px;

    padding: 19px;

    border-radius: 22px;

    border:
        1px solid
        rgba(255,255,255,.11);

    background: #101010;
}


.control {

    margin-bottom: 20px;
}


.control-head {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 9px;
}


.control label {

    font-size: 14px;

    color:
        rgba(255,255,255,.8);
}


.value {

    color: #db3544;

    font-size: 14px;

    font-variant-numeric:
        tabular-nums;
}


input[type="range"] {

    appearance: none;

    width: 100%;

    height: 6px;

    border-radius: 999px;

    background: #292929;

    outline: none;
}


input[type="range"]::-webkit-slider-thumb {

    appearance: none;

    width: 26px;

    height: 26px;

    border-radius: 50%;

    background: #fff;

    border:
        5px solid
        #971421;

    box-shadow:
        0 2px 10px
        rgba(0,0,0,.6);
}


/* =========================================
   BOTÕES
========================================= */

.actions {

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 10px;

    margin-top: 8px;
}


button {

    min-height: 52px;

    border: 0;

    border-radius: 15px;

    font-weight: 700;

    font-size: 15px;

    cursor: pointer;
}


.secondary {

    color: #fff;

    background: #1b1b1b;

    border:
        1px solid
        rgba(255,255,255,.11);
}


.save {

    grid-column:
        1 / -1;

    min-height: 60px;

    margin-top: 3px;

    border-radius: 999px;

    color: #fff;

    background:
        linear-gradient(
            135deg,
            #65000c,
            #c61b2d
        );

    font-size: 17px;

    box-shadow:
        0 10px 30px
        rgba(160,0,20,.28);
}


.status {

    min-height: 20px;

    margin:
        13px 0
        0;

    text-align: center;

    font-size: 13px;

    color: #999;
}


.status.ok {
    color: #55db83;
}


.status.error {
    color: #ff6969;
}


.site-link {

    display: block;

    margin-top: 24px;

    text-align: center;

    color: #ddd;

    text-decoration:
        underline;

    text-underline-offset:
        5px;
}

</style>
</head>

<body>

<div class="page">

<a
    href="/admin/"
    class="back"
>
    ← voltar ao painel
</a>


<h1>
    Ajustar máscara
</h1>


<p class="subtitle">
    Arraste a máscara diretamente sobre o rosto.
    Use dois dedos para aumentar, diminuir e girar.
</p>


<div class="preview-shell">

<div
    class="preview-stage"
    id="previewStage"
>

    <img
        id="previewArtist"
        alt="Mila Kadosh"
        draggable="false"
    >

    <div class="guide-x"></div>
    <div class="guide-y"></div>

    <img
        id="previewMask"
        alt="Máscara"
        draggable="false"
    >

    <div class="helper">
        arraste • pince • gire
    </div>

</div>

</div>


<div class="panel">


<div class="control">

<div class="control-head">

<label>
Horizontal
</label>

<span
    class="value"
    id="xValue"
>
50.0%
</span>

</div>

<input
    id="xRange"
    type="range"
    min="0"
    max="100"
    step="0.1"
>

</div>



<div class="control">

<div class="control-head">

<label>
Vertical
</label>

<span
    class="value"
    id="yValue"
>
15.0%
</span>

</div>

<input
    id="yRange"
    type="range"
    min="0"
    max="60"
    step="0.1"
>

</div>



<div class="control">

<div class="control-head">

<label>
Tamanho
</label>

<span
    class="value"
    id="scaleValue"
>
33.0%
</span>

</div>

<input
    id="scaleRange"
    type="range"
    min="10"
    max="70"
    step="0.1"
>

</div>



<div class="control">

<div class="control-head">

<label>
Rotação
</label>

<span
    class="value"
    id="rotationValue"
>
0.0°
</span>

</div>

<input
    id="rotationRange"
    type="range"
    min="-35"
    max="35"
    step="0.1"
>

</div>



<div class="actions">

<button
    type="button"
    class="secondary"
    id="centerButton"
>
centralizar
</button>


<button
    type="button"
    class="secondary"
    id="resetButton"
>
resetar
</button>


<button
    type="button"
    class="save"
    id="saveButton"
>
salvar posição
</button>

</div>


<p
    class="status"
    id="status"
></p>

</div>


<a
    class="site-link"
    href="/"
    target="_blank"
>
visualizar site ↗
</a>

</div>


<script>

(() => {


const stage =
    document.getElementById(
        "previewStage"
    );


const artist =
    document.getElementById(
        "previewArtist"
    );


const mask =
    document.getElementById(
        "previewMask"
    );


const status =
    document.getElementById(
        "status"
    );


const controls = {

    x:
        document.getElementById(
            "xRange"
        ),

    y:
        document.getElementById(
            "yRange"
        ),

    scale:
        document.getElementById(
            "scaleRange"
        ),

    rotation:
        document.getElementById(
            "rotationRange"
        )

};


const values = {

    x:
        document.getElementById(
            "xValue"
        ),

    y:
        document.getElementById(
            "yValue"
        ),

    scale:
        document.getElementById(
            "scaleValue"
        ),

    rotation:
        document.getElementById(
            "rotationValue"
        )

};


let state = {

    x: 50,

    y: 15,

    scale: 33,

    rotation: 0

};


let initialState =
    null;


const pointers =
    new Map();


let dragStart =
    null;


let gestureStart =
    null;



function clamp(
    value,
    min,
    max
) {

    return Math.min(
        max,
        Math.max(
            min,
            value
        )
    );

}



function setStatus(
    message,
    type = ""
) {

    status.textContent =
        message;

    status.className =
        "status " +
        type;

}



function render() {

    mask.style.left =
        state.x +
        "%";

    mask.style.top =
        state.y +
        "%";

    mask.style.width =
        state.scale +
        "%";

    mask.style.transform =
        "translate(-50%, -50%) rotate(" +
        state.rotation +
        "deg)";


    controls.x.value =
        state.x;

    controls.y.value =
        state.y;

    controls.scale.value =
        state.scale;

    controls.rotation.value =
        state.rotation;


    values.x.textContent =
        state.x.toFixed(1) +
        "%";

    values.y.textContent =
        state.y.toFixed(1) +
        "%";

    values.scale.textContent =
        state.scale.toFixed(1) +
        "%";

    values.rotation.textContent =
        state.rotation.toFixed(1) +
        "°";

}



async function loadData() {

    setStatus(
        "carregando imagens..."
    );


    try {

        const response =
            await fetch(
                "/data/site.json?t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Não consegui carregar site.json"
            );

        }


        const config =
            await response.json();


        const artistImage =
            config.hero &&
            config.hero.artistImage;


        const maskImage =
            config.hero &&
            config.hero.maskImage;


        if (
            !artistImage
        ) {

            throw new Error(
                "Foto da artista não encontrada no site.json"
            );

        }


        if (
            !maskImage
        ) {

            throw new Error(
                "Máscara não encontrada no site.json"
            );

        }


        artist.src =
            artistImage;


        mask.src =
            maskImage;


        if (
            config.maskPosition
        ) {

            const saved =
                config.maskPosition;


            if (
                Number.isFinite(
                    Number(saved.x)
                )
            ) {

                state.x =
                    Number(saved.x);

            }


            if (
                Number.isFinite(
                    Number(saved.y)
                )
            ) {

                state.y =
                    Number(saved.y);

            }


            if (
                Number.isFinite(
                    Number(saved.scale)
                )
            ) {

                state.scale =
                    Number(saved.scale);

            }


            if (
                Number.isFinite(
                    Number(saved.rotation)
                )
            ) {

                state.rotation =
                    Number(saved.rotation);

            }

        }


        initialState =
            {
                ...state
            };


        render();


        setStatus(
            "pronto para ajustar",
            "ok"
        );

    }

    catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(
            error.message,
            "error"
        );

    }

}



/* SLIDERS */

controls.x.addEventListener(
    "input",
    event => {

        state.x =
            Number(
                event.target.value
            );

        render();

    }
);


controls.y.addEventListener(
    "input",
    event => {

        state.y =
            Number(
                event.target.value
            );

        render();

    }
);


controls.scale.addEventListener(
    "input",
    event => {

        state.scale =
            Number(
                event.target.value
            );

        render();

    }
);


controls.rotation.addEventListener(
    "input",
    event => {

        state.rotation =
            Number(
                event.target.value
            );

        render();

    }
);



function distance(
    a,
    b
) {

    return Math.hypot(
        b.x - a.x,
        b.y - a.y
    );

}



function angle(
    a,
    b
) {

    return (
        Math.atan2(
            b.y - a.y,
            b.x - a.x
        )

        * 180

        / Math.PI
    );

}



function midpoint(
    a,
    b
) {

    return {

        x:
            (
                a.x +
                b.x
            ) / 2,

        y:
            (
                a.y +
                b.y
            ) / 2

    };

}



/* TOQUE */

stage.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();


        stage.setPointerCapture(
            event.pointerId
        );


        pointers.set(
            event.pointerId,
            {
                x:
                    event.clientX,

                y:
                    event.clientY
            }
        );


        if (
            pointers.size === 1
        ) {

            dragStart = {

                pointer:
                    {
                        x:
                            event.clientX,

                        y:
                            event.clientY
                    },

                state:
                    {
                        ...state
                    }

            };

        }


        if (
            pointers.size === 2
        ) {

            const [
                a,
                b
            ] =
                [
                    ...pointers.values()
                ];


            gestureStart = {

                distance:
                    distance(
                        a,
                        b
                    ),

                angle:
                    angle(
                        a,
                        b
                    ),

                midpoint:
                    midpoint(
                        a,
                        b
                    ),

                state:
                    {
                        ...state
                    }

            };

        }

    }
);



stage.addEventListener(
    "pointermove",
    event => {

        if (
            !pointers.has(
                event.pointerId
            )
        ) {

            return;

        }


        event.preventDefault();


        pointers.set(
            event.pointerId,
            {
                x:
                    event.clientX,

                y:
                    event.clientY
            }
        );


        const rect =
            stage.getBoundingClientRect();


        if (
            pointers.size === 1 &&
            dragStart
        ) {

            const point =
                [
                    ...pointers.values()
                ][0];


            const dx =
                (
                    point.x -
                    dragStart.pointer.x
                )
                /
                rect.width
                *
                100;


            const dy =
                (
                    point.y -
                    dragStart.pointer.y
                )
                /
                rect.height
                *
                100;


            state.x =
                clamp(
                    dragStart.state.x +
                    dx,
                    0,
                    100
                );


            state.y =
                clamp(
                    dragStart.state.y +
                    dy,
                    0,
                    100
                );


            render();

        }


        if (
            pointers.size === 2 &&
            gestureStart
        ) {

            const [
                a,
                b
            ] =
                [
                    ...pointers.values()
                ];


            const newDistance =
                distance(
                    a,
                    b
                );


            const newAngle =
                angle(
                    a,
                    b
                );


            const newMid =
                midpoint(
                    a,
                    b
                );


            state.scale =
                clamp(
                    gestureStart.state.scale
                    *
                    (
                        newDistance /
                        gestureStart.distance
                    ),
                    10,
                    70
                );


            state.rotation =
                clamp(
                    gestureStart.state.rotation
                    +
                    (
                        newAngle -
                        gestureStart.angle
                    ),
                    -35,
                    35
                );


            state.x =
                clamp(
                    gestureStart.state.x
                    +
                    (
                        (
                            newMid.x -
                            gestureStart.midpoint.x
                        )
                        /
                        rect.width
                        *
                        100
                    ),
                    0,
                    100
                );


            state.y =
                clamp(
                    gestureStart.state.y
                    +
                    (
                        (
                            newMid.y -
                            gestureStart.midpoint.y
                        )
                        /
                        rect.height
                        *
                        100
                    ),
                    0,
                    100
                );


            render();

        }

    }
);



function releasePointer(
    event
) {

    pointers.delete(
        event.pointerId
    );


    if (
        pointers.size === 0
    ) {

        dragStart =
            null;

        gestureStart =
            null;

    }


    else if (
        pointers.size === 1
    ) {

        const point =
            [
                ...pointers.values()
            ][0];


        dragStart = {

            pointer:
                {
                    ...point
                },

            state:
                {
                    ...state
                }

        };


        gestureStart =
            null;

    }

}


stage.addEventListener(
    "pointerup",
    releasePointer
);


stage.addEventListener(
    "pointercancel",
    releasePointer
);



document
.getElementById(
    "centerButton"
)
.addEventListener(
    "click",
    () => {

        state.x =
            50;

        state.rotation =
            0;

        render();

    }
);



document
.getElementById(
    "resetButton"
)
.addEventListener(
    "click",
    () => {

        if (
            initialState
        ) {

            state =
                {
                    ...initialState
                };

            render();

            setStatus(
                "posição restaurada"
            );

        }

    }
);



document
.getElementById(
    "saveButton"
)
.addEventListener(
    "click",
    async () => {

        const button =
            document.getElementById(
                "saveButton"
            );


        button.disabled =
            true;

        button.textContent =
            "salvando...";


        setStatus(
            "gravando posição..."
        );


        try {

            const response =
                await fetch(
                    "/api/mask-position",
                    {

                        method:
                            "POST",

                        credentials:
                            "same-origin",

                        headers:
                            {
                                "Content-Type":
                                    "application/json"
                            },

                        body:
                            JSON.stringify(
                                state
                            )

                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                !result.ok
            ) {

                throw new Error(
                    result.error ||
                    "Erro ao salvar."
                );

            }


            initialState =
                {
                    ...state
                };


            setStatus(
                "posição salva no site ✓",
                "ok"
            );

        }

        catch (
            error
        ) {

            console.error(
                error
            );


            setStatus(
                error.message,
                "error"
            );

        }

        finally {

            button.disabled =
                false;

            button.textContent =
                "salvar posição";

        }

    }
);


render();

loadData();

})();

</script>

</body>
</html>
